<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year Roundup</title>
<style>
  :root { --fg:#fff; --muted:rgba(255,255,255,.72); --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:#0b1020; color:var(--fg); font-family:var(--font); overflow:hidden; }
  #stage { position:relative; height:100%; max-width:480px; margin:0 auto; user-select:none; cursor:pointer; }
  .bars { position:absolute; top:12px; left:16px; right:16px; display:flex; gap:4px; z-index:5; }
  .bars span { flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.3); overflow:hidden; }
  .bars span i { display:block; height:100%; width:0; background:#fff; }
  .bars span.done i { width:100%; }
  .bars span.now i { animation: fill var(--dur) linear forwards; }
  @keyframes fill { to { width:100%; } }
  .slide { position:absolute; inset:0; padding:64px 28px 40px; display:none; flex-direction:column; justify-content:center; gap:18px; }
  .slide.active { display:flex; animation: pop .5s ease; }
  @keyframes pop { from { opacity:0; transform:scale(.96); } }
  .kicker { font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .big { font-size:clamp(56px, 18vw, 96px); font-weight:800; line-height:.95; letter-spacing:-.03em; }
  h2 { font-size:clamp(28px, 8vw, 40px); font-weight:800; line-height:1.1; letter-spacing:-.01em; }
  p { font-size:18px; line-height:1.45; color:var(--muted); }
  .emoji { font-size:80px; }
  ol { list-style:none; display:flex; flex-direction:column; gap:10px; counter-reset:n; }
  ol li { counter-increment:n; display:flex; align-items:baseline; gap:12px; font-size:19px; font-weight:600; }
  ol li::before { content:counter(n); font-size:28px; font-weight:800; width:28px; opacity:.6; }
  ol li small { margin-left:auto; color:var(--muted); font-weight:500; font-size:15px; white-space:nowrap; }
  .chart { display:flex; align-items:flex-end; gap:3px; height:120px; }
  .chart div { flex:1; background:rgba(255,255,255,.85); border-radius:3px 3px 0 0; min-height:2px; }
  .chart div.hi { background:#ffd84d; }
  .axis { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card { background:rgba(255,255,255,.12); border-radius:16px; padding:16px; }
  .card b { display:block; font-size:30px; font-weight:800; }
  .card span { font-size:14px; color:var(--muted); }
  .hint { position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:12px; color:var(--muted); }
  .g1 { background:linear-gradient(160deg,#03a9f4,#1a237e); }
  .g2 { background:linear-gradient(160deg,#7c4dff,#311b92); }
  .g3 { background:linear-gradient(160deg,#ff9800,#bf360c); }
  .g4 { background:linear-gradient(160deg,#ffca28,#e65100); }
  .g5 { background:linear-gradient(160deg,#26a69a,#004d40); }
  .g6 { background:linear-gradient(160deg,#ec407a,#4a148c); }
  .g7 { background:linear-gradient(160deg,#42a5f5,#b71c1c); }
  .g8 { background:linear-gradient(160deg,#5c6bc0,#0d1b4c); }
  .g9 { background:linear-gradient(160deg,#18bcf2,#0b1020); }
  .preview { position:fixed; top:22px; right:12px; z-index:6; font-size:11px; background:rgba(0,0,0,.4); padding:3px 8px; border-radius:99px; }
</style>
</head>
<body>
<div id="stage"><div class="bars" id="bars"></div><div id="slides"><section class="slide g1 active"><div class="kicker">Year Roundup</div><h2>Writing your story…</h2><p>Crunching a year of data.</p></section></div><div class="hint">Tap to continue · ← → keys</div></div>
<script>
const SAMPLE = {"year":2026,"home_name":"Home",
 "persona":{"title":"The Homebody","emoji":"🛋️","blurb":"Your home used the most energy around 18:00.","peak_hour":18},
 "hours":[0.21,0.18,0.16,0.15,0.15,0.17,0.3,0.52,0.48,0.36,0.33,0.34,0.38,0.35,0.33,0.36,0.45,0.6,0.82,0.74,0.66,0.55,0.44,0.3],
 "setup":{"devices_total":184,"devices_added":37,"entities_total":1290,"integrations":42,"automations":61,"automations_added":14,"newest_device":"Voice PE (Kitchen)"},
 "energy":{"grid":{"total_kwh":3412.6,"monthly_kwh":[420,380,330,260,210,180,170,175,220,290,360,417],"peak_day":{"date":"2026-01-14","kwh":24.1}},"solar":{"total_kwh":2840.2,"monthly_kwh":[60,110,220,320,390,420,410,360,270,160,80,40],"peak_day":{"date":"2026-06-21","kwh":21.3}},"export_kwh":910,"self_powered_pct":38,"standby_w":140,"fact":"enough to drive an EV 9,800 miles","solar_fact":"enough to drive an EV from Land's End to John o' Groats 9.4 times","standby_fact":"like leaving 18 LED bulbs on all year"},
 "devices":{"top":[{"name":"Heat pump","kwh":1840},{"name":"EV charger","kwh":1210},{"name":"Tumble dryer","kwh":310},{"name":"Fridge freezer","kwh":240}],"total_kwh":3700},
 "screen_time":{"top":[{"name":"Living room TV","hours":1260,"avg_w":38},{"name":"Gaming PC","hours":640,"avg_w":61},{"name":"Coffee machine","hours":210,"avg_w":12}],"fact":"14% of the whole year"},
 "always_on":{"name":"Network rack","hours":8760,"avg_w":42},
 "water":{"litres":148000,"peak_day":{"date":"2026-07-19","value":1220},"fact":"enough to fill 1,900 baths"},
 "batteries":{"replaced":9,"hungriest":{"name":"Front door lock","swaps":3},"top":[]},
 "air":{"stuffiest":{"name":"Bedroom","avg_ppm":980,"worst":{"date":"2026-02-11","ppm":2210}},"freshest":{"name":"Kitchen","avg_ppm":610},"rooms":4},
 "steps":{"total":2410000,"top":[{"name":"Sam's phone steps","steps":1380000},{"name":"Alex's phone steps","steps":1030000}],"fact":"46 marathons around the house"},
 "distance":{"top":[{"name":"Car odometer","km":11240},{"name":"Robot vacuum","km":96}]},
 "data":{"name":"Router download","gb":4820},
 "counters":{"top":[{"name":"Printer pages","value":1320,"unit":"pages"}]},
 "rain":{"mm":742,"wettest_day":{"date":"2026-10-03","value":41}}};

const SAMPLE_AI = {ai_agent:"Local Ollama", ai:{intro:"Grab a cuppa. Your house has been keeping notes all year, and frankly, it has opinions.",energy:"3,413 kWh, mostly in January. That 24.1 kWh day on the 14th? The heating remembers.",devices:"The heat pump ate 1,840 kWh. Worth every cosy minute.",outro:"Same time next year? The kettle's already on."}};
const fmt = n => Number(n).toLocaleString();
const date = d => new Date(d + "T12:00").toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
const short = d => new Date(d + "T12:00").toLocaleDateString(undefined, { day:"numeric", month:"short" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list = (items, unit, key="value") => `<ol>${items.map(i => `<li>${esc(i.name)}<small>${fmt(i[key])} ${unit}</small></li>`).join("")}</ol>`;
const bars = (vals, hiIdx) => { const m = Math.max(...vals, 1); return `<div class="chart">${vals.map((v,i)=>`<div class="${i===hiIdx?"hi":""}" style="height:${v/m*100}%"></div>`).join("")}</div>`; };
const fact = f => f ? `<p>That's <b>${esc(f)}</b>.</p>` : "";

function build(d) {
  const s = [];
  const ai = d.ai || {};
  const cap = (key, html) => ai[key] ? `<p>${esc(ai[key])}</p>` : html;
  const months = '<div class="axis"><span>Jan</span><span>Jun</span><span>Dec</span></div>';

  s.push(["g1", `<div class="kicker">${esc(d.home_name)}</div><div class="big">${d.year}</div><h2>Your home's year, wrapped up.</h2>${cap('intro', '<p>Here\'s what happened under your roof.</p>')}`]);

  if (d.persona) s.push(["g2", `<div class="kicker">Your home personality</div><div class="emoji">${d.persona.emoji}</div><h2>${esc(d.persona.title)}</h2>${cap('persona', `<p>${esc(d.persona.blurb)}</p>`)}${bars(d.hours, d.persona.peak_hour)}<div class="axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div><p style="font-size:13px">Average energy use by hour, all year</p>`]);

  const e = d.energy || {}, g = e.grid;
  if (g) s.push(["g3", `<div class="kicker">Energy</div><div class="big">${fmt(Math.round(g.total_kwh))}</div><h2>kWh from the grid</h2>${cap('energy', fact(e.fact))}${bars(g.monthly_kwh, g.monthly_kwh.indexOf(Math.max(...g.monthly_kwh)))}${months}<p>Hungriest day: ${date(g.peak_day.date)} (${g.peak_day.kwh} kWh).</p>`]);
  const so = e.solar;
  if (so) s.push(["g4", `<div class="kicker">Sunshine</div><div class="big">${fmt(Math.round(so.total_kwh))}</div><h2>kWh made by your panels</h2>${cap('solar', fact(e.solar_fact))}<div class="grid2">${e.self_powered_pct!=null?`<div class="card"><b>${e.self_powered_pct}%</b><span>of your power was your own</span></div>`:""}${e.export_kwh?`<div class="card"><b>${fmt(Math.round(e.export_kwh))}</b><span>kWh sent to the grid</span></div>`:""}</div><p>Best day: ${date(so.peak_day.date)}, ${so.peak_day.kwh} kWh.</p>`]);
  if (d.devices) s.push(["g7", `<div class="kicker">Biggest energy users</div><div class="big">${fmt(Math.round(d.devices.top[0].kwh))}</div><h2>kWh: ${esc(d.devices.top[0].name)}</h2>${cap('devices', '<p>Your top devices:</p>')}${list(d.devices.top, "kWh", "kwh")}`]);
  if (e.standby_w) s.push(["g8", `<div class="kicker">Always on</div><div class="big">${fmt(e.standby_w)} W</div><h2>your home's overnight standby power</h2>${cap('standby', fact(e.standby_fact))}${d.always_on?`<p>Most constant draw: <b>${esc(d.always_on.name)}</b> at ${d.always_on.avg_w} W on average.</p>`:""}`]);
  if (d.screen_time) s.push(["g6", `<div class="kicker">Screen time</div><div class="big">${fmt(d.screen_time.top[0].hours)}</div><h2>hours: ${esc(d.screen_time.top[0].name)}</h2>${cap('screen_time', fact(d.screen_time.fact))}${list(d.screen_time.top, "h", "hours")}`]);
  if (d.water) s.push(["g9", `<div class="kicker">Water</div><div class="big">${fmt(Math.round(d.water.litres))}</div><h2>litres of water</h2>${cap('water', fact(d.water.fact))}${d.water.peak_day?`<p>Thirstiest day: ${date(d.water.peak_day.date)} (${fmt(Math.round(d.water.peak_day.value))} L).</p>`:""}`]);
  if (d.gas) s.push(["g3", `<div class="kicker">Gas</div><div class="big">${fmt(Math.round(d.gas.value))}</div><h2>${d.gas.unit} of gas</h2>${cap('gas', fact(d.gas.fact))}${d.gas.peak_day?`<p>Coldest-feeling day: ${date(d.gas.peak_day.date)}.</p>`:""}`]);


  if (d.steps) s.push(["g5", `<div class="kicker">On your feet</div><div class="big">${fmt(d.steps.total)}</div><h2>steps</h2>${cap('steps', fact(d.steps.fact))}${list(d.steps.top, "", "steps")}`]);
  if (d.distance) s.push(["g4", `<div class="kicker">Distance</div><div class="big">${fmt(Math.round(d.distance.top[0].km))} km</div><h2>${esc(d.distance.top[0].name)}</h2>${cap('distance', '')}${d.distance.top.length>1?list(d.distance.top, "km", "km"):""}`]);
  if (d.air) s.push(["g5", `<div class="kicker">Air quality</div><h2>Stuffiest room: ${esc(d.air.stuffiest.name)}</h2>${cap('air', `<p>Averaged <b>${fmt(d.air.stuffiest.avg_ppm)} ppm</b> CO₂${d.air.stuffiest.worst?`, peaking at ${fmt(d.air.stuffiest.worst.ppm)} ppm on ${date(d.air.stuffiest.worst.date)}`:""}.</p>`)}${d.air.rooms>1?`<p>Freshest: <b>${esc(d.air.freshest.name)}</b> (${fmt(d.air.freshest.avg_ppm)} ppm).</p>`:""}`]);
  if (d.rain) s.push(["g9", `<div class="kicker">Rain gauge</div><div class="big">${fmt(Math.round(d.rain.mm))} mm</div><h2>of rain</h2>${cap('rain', d.rain.wettest_day?`<p>Wettest day: ${date(d.rain.wettest_day.date)} (${d.rain.wettest_day.value} mm).</p>`:"")}`]);
  if (d.batteries) s.push(["g7", `<div class="kicker">Battery life</div><div class="big">${d.batteries.replaced}</div><h2>batteries replaced</h2>${cap('batteries', `<p>Hungriest: <b>${esc(d.batteries.hungriest.name)}</b> (${d.batteries.hungriest.swaps} swaps).</p>`)}`]);
  const odds = [];
  if (d.data) odds.push({name: d.data.name, value: Math.round(d.data.gb), unit: "GB"});
  (d.counters ? d.counters.top : []).forEach(c => odds.push(c));
  if (odds.length) s.push(["g2", `<div class="kicker">Odds & ends</div><h2>Your home also counted…</h2><ol>${odds.slice(0,5).map(o=>`<li>${esc(o.name)}<small>${fmt(o.value)} ${esc(o.unit||"")}</small></li>`).join("")}</ol>`]);

  const st = d.setup;
  s.push(["g2", `<div class="kicker">Your smart home grew</div><div class="big">+${st.devices_added}</div><h2>new devices this year</h2>${cap('setup', st.newest_device?`<p>Latest arrival: <b>${esc(st.newest_device)}</b></p>`:"")}<div class="grid2"><div class="card"><b>${fmt(st.devices_total)}</b><span>devices</span></div><div class="card"><b>${fmt(st.entities_total)}</b><span>entities</span></div><div class="card"><b>${st.integrations}</b><span>integrations</span></div><div class="card"><b>${st.automations}</b><span>automations${st.automations_added?` (+${st.automations_added})`:""}</span></div></div>`]);
  s.push(["g1", `<div class="kicker">That's a wrap</div><h2>${d.year} was a big year for ${esc(d.home_name)}.</h2>${cap('outro', '')}<p>${d.ai ? `Every number was calculated on your own hardware. Captions written by ${esc(d.ai_agent || 'your AI agent')}.` : 'Every number here was calculated on your own hardware. None of it left your home.'}</p><p style="font-size:14px">Tap to watch again.</p>`]);
  return s;
}

let slides = [], idx = 0, timer;
const DUR = 7000;
function show(i) {
  idx = (i + slides.length) % slides.length;
  document.querySelectorAll(".slide").forEach((el, j) => { el.classList.toggle("active", j === idx); });
  document.querySelectorAll(".bars span").forEach((el, j) => { el.className = j < idx ? "done" : j === idx ? "now" : ""; el.innerHTML = "<i></i>"; });
  clearTimeout(timer);
  if (idx < slides.length - 1) timer = setTimeout(() => show(idx + 1), DUR);
}
function render(d, preview) {
  slides = build(d);
  document.getElementById("slides").innerHTML = slides.map(([g, h]) => `<section class="slide ${g}">${h}</section>`).join("") + (preview ? '<div class="preview">Preview data</div>' : "");
  document.getElementById("bars").innerHTML = slides.map(() => "<span><i></i></span>").join("");
  document.documentElement.style.setProperty("--dur", DUR + "ms");
  const start = Number(new URLSearchParams(location.search).get("slide") || 0);
  show(start);
}
document.getElementById("stage").addEventListener("click", e => show(e.clientX < innerWidth / 3 ? idx - 1 : idx + 1));
addEventListener("keydown", e => { if (e.key === "ArrowRight") show(idx + 1); if (e.key === "ArrowLeft") show(idx - 1); });

(async () => {
  let hass;
  try { hass = window.parent.document.querySelector("home-assistant").hass; } catch (_) {}
  const q = new URLSearchParams(location.search);
  if (!hass) return render(q.get("ai") ? { ...SAMPLE, ...SAMPLE_AI } : SAMPLE, true);
  const year = Number(new URLSearchParams(location.search).get("year")) || undefined;
  try { render(await hass.callWS({ type: "year_roundup/get", refresh: q.has("refresh"), ...(year && { year }) }), false); }
  catch (err) { console.error(err); render(SAMPLE, true); }
})();
</script>
</body>
</html>
